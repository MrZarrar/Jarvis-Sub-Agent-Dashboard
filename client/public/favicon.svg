<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="55%" stop-color="#0c2a3a"/>
      <stop offset="100%" stop-color="#00c2e8"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="45%" stop-color="#7fe9ff"/>
      <stop offset="100%" stop-color="#00c2e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bdf3ff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Full-bleed background, no transparency: fills the whole square edge-to-edge so
       the OS's own corner mask (iOS/Android) is what rounds it, not the artwork. -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- Soft ambient glow behind the hexagon for depth on dark backgrounds -->
  <circle cx="256" cy="230" r="170" fill="url(#core)" opacity="0.55" filter="url(#soft)"/>

  <!-- Hexagon frame -->
  <polygon points="256,84 388,158 388,306 256,380 124,306 124,158"
           fill="none" stroke="#8fe9ff" stroke-width="14" stroke-linejoin="round" opacity="0.9"/>

  <!-- Connector lines radiating from center to the three lower/side nodes and one top node -->
  <g stroke="url(#node)" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="232" x2="256" y2="150"/>
    <line x1="285" y1="250" x2="352" y2="290"/>
    <line x1="227" y1="250" x2="160" y2="290"/>
  </g>

  <!-- Center node -->
  <circle cx="256" cy="256" r="46" fill="url(#node)"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#00c2e8" stroke-width="6" opacity="0.5"/>

  <!-- Outer nodes -->
  <circle cx="256" cy="140" r="26" fill="url(#node)"/>
  <circle cx="362" cy="298" r="26" fill="url(#node)"/>
  <circle cx="150" cy="298" r="26" fill="url(#node)"/>
</svg>
