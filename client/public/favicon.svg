<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#12212e"/>
      <stop offset="55%" stop-color="#0d1620"/>
      <stop offset="100%" stop-color="#080b10"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="35%" stop-color="#5fe4ff"/>
      <stop offset="75%" stop-color="#00c2e8"/>
      <stop offset="100%" stop-color="#00c2e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fe9ff"/>
      <stop offset="100%" stop-color="#00a3c4"/>
    </linearGradient>
    <radialGradient id="node" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8fe3ff"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Full-bleed dark background (no transparency; OS applies its own corner mask) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- Everything below is centered on (256,256) and symmetric in all directions -->

  <!-- Ambient core glow -->
  <circle cx="256" cy="256" r="150" fill="url(#coreGlow)" opacity="0.30" filter="url(#blur)"/>

  <!-- Connector spokes: center to each hexagon vertex (pointy-top, R=150) -->
  <g stroke="url(#ring)" stroke-width="9" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="256" x2="256" y2="106"/>
    <line x1="256" y1="256" x2="386" y2="181"/>
    <line x1="256" y1="256" x2="386" y2="331"/>
    <line x1="256" y1="256" x2="256" y2="406"/>
    <line x1="256" y1="256" x2="126" y2="331"/>
    <line x1="256" y1="256" x2="126" y2="181"/>
  </g>

  <!-- Hexagon frame -->
  <polygon points="256,106 386,181 386,331 256,406 126,331 126,181"
           fill="none" stroke="url(#ring)" stroke-width="13" stroke-linejoin="round"/>

  <!-- Vertex nodes -->
  <g fill="url(#node)">
    <circle cx="256" cy="106" r="20"/>
    <circle cx="386" cy="181" r="20"/>
    <circle cx="386" cy="331" r="20"/>
    <circle cx="256" cy="406" r="20"/>
    <circle cx="126" cy="331" r="20"/>
    <circle cx="126" cy="181" r="20"/>
  </g>

  <!-- Central hub -->
  <circle cx="256" cy="256" r="58" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="42" fill="url(#node)"/>
  <circle cx="256" cy="256" r="42" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
</svg>
